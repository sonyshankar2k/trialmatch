# One command starts everything:  docker compose up --build
#   App:       http://localhost:8080   (demo: alice@trialmatch.dev / trialmatch-demo)
#   API docs:  http://localhost:3000/api/docs
# For AI matching with Claude, put ANTHROPIC_API_KEY=... in a .env file next to this
# one (see .env.example). Without it, a free rule-based engine is used.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: trialmatch
      POSTGRES_PASSWORD: trialmatch
      POSTGRES_DB: trialmatch
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trialmatch']
      interval: 3s
      timeout: 3s
      retries: 20

  # BullMQ job queue for matching runs, and pub/sub for their live progress.
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://trialmatch:trialmatch@db:5432/trialmatch
      # Local demo only. Anywhere real, use a long random secret from a secrets manager.
      JWT_SECRET: local-docker-secret-change-me-0123456789abcdef
      CORS_ORIGINS: http://localhost:8080,http://localhost:4200
      SEED_DEMO_DATA: 'true'
      TRUST_PROXY: '1' # nginx (the web service) is in front of the API
      # Sign-in attempts per minute per client. CI raises it: the e2e suite signs in often.
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      REDIS_URL: redis://redis:6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # A short pause per trial so the live progress is visible in the demo.
      MATCH_STEP_DELAY_MS: '500'
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
