# Publishes the component library to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx build-storybook web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/storybook-static
      - id: deployment
        uses: actions/deploy-pages@v4
