name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  # Lint, typecheck, test and build only the projects a change affects
  # (Nx project graph). API tests run against a real PostgreSQL.
  main:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trialmatch
          POSTGRES_PASSWORD: trialmatch
          POSTGRES_DB: trialmatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://trialmatch:trialmatch@localhost:5432/trialmatch_test
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so Nx can compare against the last green commit
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
        if: github.event_name == 'pull_request'
      - name: Formatting
        run: npx prettier --check .
      # Pull requests check only what the change affects; main checks everything.
      - name: Lint, typecheck, test, build
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            npx nx affected -t lint typecheck test build build-storybook --parallel=3
          else
            npx nx run-many -t lint typecheck test build build-storybook --parallel=3
          fi
      - name: Migrations match the schema
        working-directory: apps/api
        run: |
          npx nx build shared
          npx drizzle-kit generate --name ci-check
          git diff --exit-code -- src/app/db/migrations || (echo "Schema changed without a migration: run npm run db:generate" && exit 1)
          test -z "$(git ls-files --others --exclude-standard src/app/db/migrations)" || (echo "Schema changed without a migration: run npm run db:generate" && exit 1)

  # The production images, started together and tested from the outside.
  docker:
    runs-on: ubuntu-latest
    needs: main
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        env:
          AUTH_RATE_LIMIT_PER_MINUTE: '200' # the e2e suite signs in many times a minute
        run: docker compose up -d --build --wait
      - name: Smoke test through the web server
        run: |
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/api/health
          TOKEN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"alice@trialmatch.dev","password":"trialmatch-demo"}' | jq -r .accessToken)
          AUTH="Authorization: Bearer $TOKEN"
          curl -sf -H "$AUTH" http://localhost:8080/api/trials | jq -e '.total == 5'
          # A match run goes through the BullMQ worker; its progress streams through nginx.
          RUN=$(curl -sf -X POST -H "$AUTH" http://localhost:8080/api/patients/1/match-runs | jq -r .id)
          timeout 60 curl -sfN -H "$AUTH" http://localhost:8080/api/match-runs/$RUN/events | tee events.txt > /dev/null
          grep -q '"status":"succeeded"' events.txt
      # Real browser against the running stack: flows, two-user conflicts,
      # AI matching over the event stream, and WCAG 2.1 AA checks (axe).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Playwright
        run: npm ci && npx playwright install --with-deps chromium
      - name: End-to-end tests
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:8080
        run: npx nx e2e web-e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report
          retention-days: 7

  # The single-container image used for hosting (Render): the API serves the app.
  image:
    runs-on: ubuntu-latest
    needs: main
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trialmatch
          POSTGRES_PASSWORD: trialmatch
          POSTGRES_DB: trialmatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t trialmatch .
      - name: Run it like Render does (PORT set by the platform, behind a proxy)
        run: |
          docker run -d --name app --network host \
            -e PORT=10000 -e TRUST_PROXY=1 \
            -e DATABASE_URL=postgres://trialmatch:trialmatch@localhost:5432/trialmatch \
            -e JWT_SECRET=ci-only-secret-0123456789abcdef0123456789 \
            trialmatch
          for i in $(seq 1 30); do curl -sf http://localhost:10000/api/health && break; sleep 2; done
      - name: Smoke test
        run: |
          curl -sf http://localhost:10000/ | grep -q '<div id="root">'
          curl -sf http://localhost:10000/trials/1 | grep -q '<div id="root">'   # deep link -> the app
          curl -s -o /dev/null -w '%{http_code}' http://localhost:10000/api/nope | grep -q 404
          TOKEN=$(curl -sf -X POST http://localhost:10000/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"alice@trialmatch.dev","password":"trialmatch-demo"}' | jq -r .accessToken)
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:10000/api/trials | jq -e '.total == 5'
      - name: Container logs
        if: failure()
        run: docker logs app
